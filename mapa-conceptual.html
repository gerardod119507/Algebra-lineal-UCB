<style>
/* Layout: lienzo a pantalla completa sobre papel milimetrado; árbol horizontal que se despliega
   desde la raíz, barra mínima arriba y ficha de detalle que aparece al elegir un concepto. */
:root {
  --bg: #eef1f4;
  --sheet: #fbfcfd;
  --bar: rgba(244, 246, 248, .9);
  --ink: #27313b;
  --muted: #687582;
  --faint: #9aa5b0;
  --line: #d9dfe6;
  --grid: rgba(74, 114, 144, .055);
  --shadow: rgba(39, 49, 59, .35);
  --accent: #4a7290;
  --accent-ink: #ffffff;
  --t4: #4a7290;  --t4-bg: #eaf1f6;
  --t5: #7d6896;  --t5-bg: #f1eef6;
  --met: #4b836a; --met-bg: #e9f3ee;
  --link: #b9c3cd;
  --hit: #9a7642;
  --scrim: rgba(25, 32, 40, .28);
  --f-display: "Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151a20; --sheet: #1c232b; --bar: rgba(24, 30, 37, .9);
    --ink: #dde4ea; --muted: #9ba8b4; --faint: #6d7a87; --line: #2e3842;
    --grid: rgba(143, 179, 207, .045); --shadow: rgba(0, 0, 0, .7);
    --accent: #8fb3cf; --accent-ink: #13202b;
    --t4: #8fb3cf; --t4-bg: #1f2c37;
    --t5: #b8a3cf; --t5-bg: #282436;
    --met: #8bc4a8; --met-bg: #1d2e28;
    --link: #3c4855; --hit: #d3b17d; --scrim: rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151a20; --sheet: #1c232b; --bar: rgba(24, 30, 37, .9);
  --ink: #dde4ea; --muted: #9ba8b4; --faint: #6d7a87; --line: #2e3842;
  --grid: rgba(143, 179, 207, .045); --shadow: rgba(0, 0, 0, .7);
  --accent: #8fb3cf; --accent-ink: #13202b;
  --t4: #8fb3cf; --t4-bg: #1f2c37;
  --t5: #b8a3cf; --t5-bg: #282436;
  --met: #8bc4a8; --met-bg: #1d2e28;
  --link: #3c4855; --hit: #d3b17d; --scrim: rgba(0, 0, 0, .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.btn[hidden] { display: none; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* barra */
.bar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--bar); border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px); position: relative; z-index: 5;
}
.bar h1 { margin: 0 8px 0 0; font-family: var(--f-display); font-weight: 500; font-size: 21px; white-space: nowrap; }
.spacer { flex: 1; }
.btn {
  height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); border-radius: 8px; background: transparent; cursor: pointer; font-size: 14px; text-decoration: none; color: var(--ink);
}
.btn:hover { background: var(--t4-bg); border-color: var(--faint); }
.btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.btn[aria-pressed="true"] { background: var(--t4-bg); border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg .btn { border: 0; border-radius: 0; }
.seg .btn + .btn { border-left: 1px solid var(--line); }
.find { position: relative; }
.find input { height: 34px; width: 210px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
@media (max-width: 760px) {
  .bar h1 { font-size: 18px; flex: 1; }
  .hide-sm { display: none !important; }
  .find { order: 10; flex: 1 1 100%; }
  .find input { width: 100%; }
}

/* lienzo */
.view { position: relative; overflow: hidden; touch-action: none; cursor: grab; }
.view.dragging { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.links path { fill: none; stroke: var(--link); stroke-width: 1.6; }
.links path.on { stroke: var(--accent); stroke-width: 2.2; }
.node {
  position: absolute; left: 0; top: 0; width: 196px; min-height: 50px;
  display: flex; align-items: center; gap: 8px; text-align: left;
  padding: 8px 12px; border-radius: 10px; cursor: pointer;
  border: 1px solid var(--line); background: var(--sheet); color: var(--ink);
  font-size: 14.5px; line-height: 1.25; font-weight: 500;
  box-shadow: 0 8px 18px -16px var(--shadow);
  transition: background .15s, border-color .15s, box-shadow .15s, opacity .2s;
}
.node .lbl { flex: 1; min-width: 0; }
.node .more {
  flex: none; font-family: var(--f-mono); font-size: 11px; font-weight: 500;
  border-radius: 999px; padding: 1px 7px; background: var(--bg); color: var(--muted);
}
.node.open .more { background: transparent; color: var(--faint); }
.node.t4 { border-color: color-mix(in srgb, var(--t4) 35%, var(--line)); }
.node.t5 { border-color: color-mix(in srgb, var(--t5) 35%, var(--line)); }
.node.concept.t4 { background: var(--t4-bg); }
.node.concept.t5 { background: var(--t5-bg); }
.node.met { border-style: dashed; border-color: var(--met); }
.node.root { background: var(--ink); color: var(--sheet); border-color: var(--ink); font-family: var(--f-display); font-size: 17px; font-weight: 500; }
.node.root .more { background: transparent; color: var(--sheet); opacity: .7; }
.node.sel { box-shadow: 0 0 0 2px var(--accent), 0 10px 24px -16px var(--shadow); }
.node.hit { box-shadow: 0 0 0 2px var(--hit); }
.node.dim { opacity: .35; }
.node[hidden] { display: none; }

.legend {
  position: absolute; left: 16px; bottom: 16px; z-index: 3;
  display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px;
  background: var(--bar); border: 1px solid var(--line); border-radius: 8px;
  font-size: 12.5px; color: var(--muted); max-width: calc(100% - 32px);
}
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid; }
.legend .l4 { background: var(--t4-bg); border-color: var(--t4); }
.legend .l5 { background: var(--t5-bg); border-color: var(--t5); }
.legend .lm { background: transparent; border: 1px dashed var(--met); }
.hint { position: absolute; right: 16px; bottom: 16px; z-index: 3; font-size: 12.5px; color: var(--muted); background: var(--bar); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
@media (max-width: 760px) { .hint { display: none; } }

/* lista */
.list { overflow-y: auto; padding: 24px 16px 60px; }
.list-inner { max-width: 760px; margin: 0 auto; }
.list details { margin-left: 18px; border-left: 1px solid var(--line); padding-left: 12px; }
.list > .list-inner > details { margin-left: 0; border-left: 0; padding-left: 0; }
.list summary { cursor: pointer; padding: 6px 4px; list-style: none; display: flex; gap: 8px; align-items: baseline; }
.list summary::-webkit-details-marker { display: none; }
.list summary::before { content: "›"; width: .8em; color: var(--faint); display: inline-block; transition: transform .15s; }
.list details[open] > summary::before { transform: rotate(90deg); }
.list .leaf { margin-left: 18px; padding: 6px 4px 6px 16px; border-left: 1px solid var(--line); }
.list .item { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; font-weight: 500; }
.list .item:hover { color: var(--accent); }
.list .sub { color: var(--muted); font-size: 14px; }

/* ficha */
.panel {
  position: absolute; z-index: 6; top: 12px; right: 12px; bottom: 12px;
  width: min(380px, calc(100% - 24px));
  background: var(--sheet); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 30px 60px -40px var(--shadow);
  display: grid; grid-template-rows: auto 1fr auto;
  transform: translateX(calc(100% + 24px)); transition: transform .25s ease;
}
.panel.show { transform: none; }
@media (max-width: 760px) {
  .panel { top: auto; left: 12px; right: 12px; width: auto; max-height: 62%; transform: translateY(calc(100% + 24px)); }
}
@media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 16px 16px 4px 20px; }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.panel h2 { margin: 4px 0 0; font-family: var(--f-display); font-weight: 500; font-size: 26px; line-height: 1.15; text-wrap: balance; }
.panel-body { overflow-y: auto; padding: 8px 20px 12px; min-width: 0; }
.panel-body p { margin: 0 0 12px; }
.formula { background: var(--bg); border-radius: 8px; padding: 6px 12px; margin: 6px 0 14px; overflow-x: auto; }
.formula mjx-container[display="true"] { margin: .5em 0 !important; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 13.5px; background: transparent; cursor: pointer; text-decoration: none; color: var(--ink); }
.chip:hover { border-color: var(--accent); background: var(--t4-bg); }
.label { display: block; margin: 12px 0 6px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.panel-foot { border-top: 1px solid var(--line); padding: 12px 16px; }
.panel-foot a {
  display: flex; justify-content: space-between; align-items: center;
  text-decoration: none; font-weight: 500; padding: 9px 12px; border-radius: 8px;
  background: var(--accent); color: var(--accent-ink);
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <h1>Mapa conceptual</h1>
    <div class="seg" role="group" aria-label="Forma de ver el mapa">
      <button class="btn" id="v-map" type="button" aria-pressed="true">Mapa</button>
      <button class="btn" id="v-list" type="button" aria-pressed="false">Lista</button>
    </div>
    <button class="btn" id="b-expand" type="button" title="Desplegar todo">Desplegar<span class="hide-sm">todo</span></button>
    <button class="btn" id="b-collapse" type="button" title="Plegar todo">Plegar</button>
    <span class="spacer hide-sm"></span>
    <div class="find"><input id="buscar" type="search" placeholder="Buscar un concepto…" autocomplete="off" aria-label="Buscar un concepto"></div>
    <button class="btn hide-sm" id="b-zout" type="button" aria-label="Alejar" title="Alejar"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="btn hide-sm" id="b-zin" type="button" aria-label="Acercar" title="Acercar"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    <button class="btn" id="b-fit" type="button" aria-label="Encuadrar el mapa" title="Encuadrar"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="btn" id="b-theme" type="button" aria-label="Cambiar entre tema claro y oscuro" title="Tema claro u oscuro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
    <a class="btn" href="index.html" title="Ir a la plataforma de diapositivas"><span class="hide-sm">Diapositivas</span><span aria-hidden="true">→</span><span class="sr">Diapositivas</span></a>
  </header>

  <main class="view" id="view">
    <div class="world" id="world"><svg class="links" id="links" width="1" height="1"></svg></div>
    <div class="legend"><span><i class="l4"></i>Tema 4</span><span><i class="l5"></i>Tema 5</span><span><i class="lm"></i>Método o caso particular</span></div>
    <div class="hint">Clic en un concepto para desplegarlo · arrastra para moverte · rueda para acercar</div>
    <aside class="panel" id="panel" aria-live="polite">
      <div class="panel-head">
        <div><div class="eyebrow" id="p-eyebrow"></div><h2 id="p-title"></h2></div>
        <button class="btn" id="p-close" type="button" aria-label="Cerrar la ficha"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="panel-body" id="p-body"></div>
      <div class="panel-foot"><a id="p-go" href="index.html">Ver en las diapositivas <span aria-hidden="true">→</span></a></div>
    </aside>
  </main>
  <section class="list" id="list" hidden><div class="list-inner" id="list-inner"></div></section>
</div>

<script>
(function () {
  'use strict';
  /* ---------------- contenido del mapa ---------------- */
  var DATA = {
    id: 'root', label: 'Álgebra Lineal · Temas 4 y 5', kind: 'root', slide: 'inicio',
    text: 'Dos grandes ideas: los <b>espacios vectoriales</b> (dónde viven los vectores y cómo se combinan) y el <b>producto interno</b> (cómo medirlos).',
    children: [
      { id: 'ev', label: 'Espacio vectorial (E.V.)', kind: 'concept', tema: 't4', slide: 't4-def',
        text: 'Conjunto no vacío $V$ con una suma $u+v$ y un producto por escalar $\\alpha u$ que siempre quedan dentro de $V$ y cumplen 8 propiedades.',
        children: [
          { id: 'prop', label: 'Las 8 propiedades', kind: 'concept', tema: 't4', slide: 't4-prop1',
            text: 'Reglas que deben cumplir la suma y el producto por escalar. Si falla una sola, no es espacio vectorial.',
            children: [
              { id: 'prop-s', label: 'Suma (1–4)', kind: 'met', tema: 't4', slide: 't4-prop1',
                text: 'Asociativa, existe el vector cero, cada vector tiene opuesto y la suma es conmutativa.',
                formula: 'u+0=u,\\qquad u+(-u)=0,\\qquad u+v=v+u' },
              { id: 'prop-p', label: 'Producto por escalar (5–8)', kind: 'met', tema: 't4', slide: 't4-prop2',
                text: 'Dos distributivas, la asociativa del producto y que multiplicar por 1 no cambia nada.',
                formula: '\\alpha(u+v)=\\alpha u+\\alpha v,\\qquad 1u=u' }
            ] },
          { id: 'ejs', label: 'Ejemplos', kind: 'concept', tema: 't4', slide: 't4-ej-rn',
            text: 'Los espacios vectoriales con los que trabajamos en todo el curso.',
            children: [
              { id: 'rn', label: 'ℝⁿ', kind: 'met', tema: 't4', slide: 't4-ej-rn', text: 'Listas de $n$ números. Se suma y se multiplica componente a componente.', formula: '(a_1,\\dots,a_n)+(b_1,\\dots,b_n)=(a_1+b_1,\\dots,a_n+b_n)' },
              { id: 'mmn', label: 'Matrices Mₘₓₙ(ℝ)', kind: 'met', tema: 't4', slide: 't4-ej-mat', text: 'Matrices del mismo tamaño, con la suma de matrices y el producto por escalar.' },
              { id: 'pn', label: 'Polinomios Pₙ(ℝ)', kind: 'met', tema: 't4', slide: 't4-ej-pol', text: 'Polinomios de grado a lo sumo $n$. Se suman los coeficientes del mismo grado.' },
              { id: 'contra', label: 'Contraejemplo', kind: 'met', tema: 't4', slide: 't4-ej-no', text: 'En $\\mathbb{R}^2$ con $\\alpha(a_1,a_2)=(2\\alpha a_1,2\\alpha a_2)$ falla la propiedad 7, así que no es E.V.' }
            ] },
          { id: 'sub', label: 'Subespacio', kind: 'concept', tema: 't4', slide: 't4-sub-def', tp: ['tp1a', 'tp1b', 'tp1c', 'tp1d'],
            text: 'Parte $W$ de $V$ que también es espacio vectorial. Basta comprobar que es cerrado bajo la suma y el producto por escalar.',
            formula: 'u,v\\in W\\Rightarrow u+v\\in W,\\qquad \\alpha u\\in W',
            children: [
              { id: 'sub-cero', label: 'Primero: ¿está el 0?', kind: 'met', tema: 't4', slide: 't4-sub-ej2', text: 'Si el vector cero no está en $W$, no es subespacio. Una ecuación con un número suelto ($=1$) o una desigualdad ($>0$) lo delata.' },
              { id: 'sub-hom', label: 'Ecuaciones = 0 → sí', kind: 'met', tema: 't4', slide: 't4-sub-ej3', text: 'Si $W$ se describe con ecuaciones lineales igualadas a cero, siempre es subespacio.', formula: 'W=\\{(a,b,c)\\,/\\,a+2b-c=0\\}' }
            ] },
          { id: 'cl', label: 'Combinación lineal', kind: 'concept', tema: 't4', slide: 't4-cl-def', tp: ['tp2a', 'tp2b', 'tp2c', 'tp3'],
            text: '$v$ es combinación lineal de $A$ si se puede armar con los vectores de $A$ multiplicados por números y sumados.',
            formula: 'v=\\sum_{i=1}^{n}\\alpha_iv_i',
            children: [
              { id: 'gen', label: 'Subespacio generado', kind: 'concept', tema: 't4', slide: 't4-gen-def', tp: ['tp11a', 'tp11b', 'tp11c'], rel: ['sub'],
                text: 'El conjunto de <b>todas</b> las combinaciones lineales de $A$. Siempre es un subespacio.',
                formula: 'W=\\left\\{v\\in V\\,/\\,v=\\textstyle\\sum\\alpha_iv_i\\right\\}' },
              { id: 'sg', label: 'Sistema de generadores', kind: 'concept', tema: 't4', slide: 't4-sg-def', tp: ['tp7a', 'tp7b', 'tp7c'],
                text: '$A$ genera $V$ si <b>todo</b> vector de $V$ es combinación lineal de $A$.',
                formula: 'A\\text{ es S.G. de }V\\iff\\forall v\\in V,\\;v=\\textstyle\\sum\\alpha_iv_i' }
            ] },
          { id: 'li', label: 'Independencia lineal', kind: 'concept', tema: 't4', slide: 't4-li-def', tp: ['tp4a', 'tp4b', 'tp4c', 'tp4d', 'tp5', 'tp6'],
            text: 'Pregunta si en una familia «sobra» algún vector. Se iguala la combinación lineal a cero.',
            formula: '\\alpha_1v_1+\\alpha_2v_2+\\dots+\\alpha_nv_n=0_V',
            children: [
              { id: 'li-li', label: 'L.I.', kind: 'concept', tema: 't4', slide: 't4-li-def', text: 'La única solución es $\\alpha_1=\\dots=\\alpha_n=0$. Ningún vector sobra.' },
              { id: 'li-ld', label: 'L.D.', kind: 'concept', tema: 't4', slide: 't4-li-def', text: 'Hay una solución con algún $\\alpha_i\\neq0$. Al menos un vector es C.L. de los demás.' },
              { id: 'li-det', label: 'Atajo: determinante', kind: 'met', tema: 't4', slide: 't4-li-met', text: 'Si la matriz de los vectores es cuadrada: $\\det\\neq0\\Rightarrow$ L.I. y $\\det=0\\Rightarrow$ L.D. Con más vectores que la dimensión, siempre L.D.' }
            ] },
          { id: 'base', label: 'Base', kind: 'concept', tema: 't4', slide: 't4-base-def', tp: ['tp8a', 'tp8b', 'tp8c', 'tp8d'], rel: ['li', 'sg'],
            text: 'Familia que es L.I. y además genera el espacio: alcanza para armar todo y no sobra ninguno.',
            formula: '\\text{Base}=\\text{L.I.}+\\text{S.G.}',
            children: [
              { id: 'dim', label: 'Dimensión', kind: 'concept', tema: 't4', slide: 't4-dim-teo',
                text: 'Número de vectores de cualquier base. Todas las bases de un espacio tienen la misma cantidad.',
                children: [
                  { id: 'dim-rn', label: 'dim ℝⁿ = n', kind: 'met', tema: 't4', slide: 't4-dim-ej', text: 'Base canónica de $\\mathbb{R}^3$: $\\{(1,0,0),(0,1,0),(0,0,1)\\}$.' },
                  { id: 'dim-m', label: 'dim Mₘₓₙ = m·n', kind: 'met', tema: 't4', slide: 't4-dim-ej', text: '$M_2(\\mathbb{R})$ tiene dimensión 4: una matriz con un 1 en cada posición.' },
                  { id: 'dim-p', label: 'dim Pₙ = n + 1', kind: 'met', tema: 't4', slide: 't4-dim-ej', text: 'Base de $P_2(\\mathbb{R})$: $\\{t^2,\\,t,\\,1\\}$, así que $\\dim P_2=3$.' }

    panel.style.position = list ? 'fixed' : '';
    if (list) buildList(); else { relayout(); setTimeout(fit, 30); }
    store.set('al-map-mode', list ? 'list' : 'map');
  }
  $('v-map').addEventListener('click', function () { setMode(false); });
  $('v-list').addEventListener('click', function () { setMode(true); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closePanel();
    if (e.target.tagName === 'INPUT') return;
    if (e.key === '+' || e.key === '=') $('b-zin').click();
    if (e.key === '-') $('b-zout').click();
    if (e.key === '0') fit();
  });
  window.addEventListener('resize', function () { if (!listMode) fit(); });

  /* ---------------- inicio ---------------- */
  layout();
  nodes.forEach(function (n) { n.x = n.tx; n.y = n.ty; });
  draw();
  fit();
  if (store.get('al-map-mode') === 'list') setMode(true);
})();
</script>
</body>
</html>
